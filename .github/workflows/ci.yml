name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check (catch syntax errors)
        run: python -m compileall -q .

      - name: Unit tests
        run: pytest tests/ -v

      - name: Multi-tenancy scoping scan (informational — see tests/check_household_scoping.py)
        run: python tests/check_household_scoping.py
        continue-on-error: true

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here: actions/setup-node's cache step hard-fails (not
      # just skips) when cache-dependency-path doesn't resolve to a real
      # file, and frontend/package-lock.json doesn't exist yet — see the
      # TODO below. Re-add `cache: npm` / cache-dependency-path once the
      # lockfile is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TODO: switch to `npm ci` (and re-enable npm caching above) once
      # frontend/package-lock.json is committed — there is currently no
      # lockfile in the repo, see CLAUDE.md production-readiness notes.
      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (static export smoke test)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_API_URL: "https://placeholder.example.com"
          NEXT_PUBLIC_SITE_URL: "https://placeholder.example.com"
        run: npm run build
