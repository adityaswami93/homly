# Alembic config for Homly.
#
# No ORM models here — this project talks to Postgres through the raw
# supabase-py client, not SQLAlchemy. Alembic is used purely for its
# migration engine: a versioned, parent-pointer chain of revisions, each
# running op.execute() over a plain .sql file. Autogenerate is unused.
#
# The database URL is intentionally NOT set here — see env.py, which reads
# SUPABASE_DB_URL from the environment so no connection string (or password)
# ever lives in a committed file.

[alembic]
script_location = alembic

# Revision filenames as YYYYMMDDHHMM_<revision>_<slug>.py so `ls` sorts them
# chronologically. The revision id (not the filename) is what actually
# chains parent -> child, so this is purely for human readability.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
