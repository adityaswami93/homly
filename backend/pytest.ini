[pytest]
# rootdir is backend/, so `pytest` with no arguments does the right thing from
# there and CI doesn't need to pass a path.
testpaths = tests

# Imports in this codebase are rooted at backend/ (`from services.db import ...`).
# Three things kept that working before this file existed: CI's
# `working-directory: backend`, a sys.path.insert in tests/conftest.py, and
# sys.path.append at the top of api/main.py and api/routers/expenses.py.
# This makes it explicit and independent of the working directory.
#
# tests/conftest.py keeps its sys.path line anyway — it is what lets a single
# test module be run directly from a different cwd, and the entrypoint
# sys.path.append calls are still load-bearing outside pytest (ruff.toml
# globally ignores E402 because of them). Removing either is a separate cleanup.
pythonpath = .

# --strict-markers turns a typo'd @pytest.mark.foo into an error instead of a
# silently-ignored decorator.
addopts = --strict-markers
